version: '3.8'

services:
  alas-db:
    image: postgres:16-alpine
    container_name: alas-db
    environment:
      POSTGRES_DB: ${ALAS_DB_NAME:-alas}
      POSTGRES_USER: ${ALAS_DB_USER:-alas_user}
      POSTGRES_PASSWORD: ${ALAS_DB_PASSWORD:-change-this-strong-password}
    volumes:
      - alas_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - alas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALAS_DB_USER:-alas_user} -d ${ALAS_DB_NAME:-alas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  alas-app:
    image: ghcr.io/naxprmn/alas-app:latest
    container_name: alas-app
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALAS_SERVICE_TOKEN: ${ALAS_SERVICE_TOKEN}
      ALAS_WEBHOOK_SECRET: ${ALAS_WEBHOOK_SECRET}
      ALAS_REPLAY_WINDOW_SECONDS: ${ALAS_REPLAY_WINDOW_SECONDS:-300}
      LAWET_API_URL: ${LAWET_API_URL}
      HERO_UPLOAD_DIR: /app/public/uploads/hero
      ALAS_ADMIN_ROLE_LEVEL: ${ALAS_ADMIN_ROLE_LEVEL:-3}
    volumes:
      - alas_public_uploads:/app/public/uploads
    depends_on:
      alas-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alas-net

  alas-nginx:
    image: nginx:1.25-alpine
    container_name: alas-nginx
    ports:
      - "2006:80"
    volumes:
      - ./nginx/alas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - alas-app
    restart: unless-stopped
    networks:
      - alas-net

networks:
  alas-net:
    driver: bridge

volumes:
  alas_db_data:
  alas_public_uploads:
