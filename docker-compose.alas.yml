version: '3.8'

services:
  alas-db:
    image: postgres:16-alpine
    container_name: alas-db
    environment:
      POSTGRES_DB: alas
      POSTGRES_USER: alas_user
      POSTGRES_PASSWORD: change-this-strong-password
    volumes:
      - alas_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - alas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alas_user -d alas"]
      interval: 10s
      timeout: 5s
      retries: 5

  alas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alas-app
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://alas_user:change-this-strong-password@alas-db:5432/alas
      ALAS_SERVICE_TOKEN: change-this-generate-openssl-rand-hex-32
      LAWET_HUB_ADMIN_URL: https://lawethub.pusdakum.web.id/superadmin/jurnal-alas
      NEXT_PUBLIC_MINIO_PUBLIC_ENDPOINT: https://media.domain.com
      NEXT_PUBLIC_ALAS_API_URL: https://alas.bawaslu-kebumen.go.id/api
    depends_on:
      alas-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alas-net

  alas-nginx:
    image: nginx:1.25-alpine
    container_name: alas-nginx
    ports:
      - "2006:80"
    volumes:
      - ./nginx/alas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - alas-app
    restart: unless-stopped
    networks:
      - alas-net

networks:
  alas-net:
    driver: bridge

volumes:
  alas_db_data:
